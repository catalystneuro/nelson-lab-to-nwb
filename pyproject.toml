[project]
name = "nelson-lab-to-nwb"
version = "0.2.0"
description = "NWB conversion scripts, functions, and classes for Nelson Lab conversion"
readme = "README.md"
authors = [{ name = "CatalystNeuro", email = "ben.dichter@catalystneuro.com" }]
maintainers = [
    { name = "CatalystNeuro", email = "ben.dichter@catalystneuro.com" },
]
license = { file = "LICENSE" }
requires-python = ">=3.11,<3.14"
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "neuroconv<=0.11",
    "spikeinterface>=0.103,<0.105",
    # Reads NeuroExplorer files above 2 GB, merged in python-neo PR #1898 and not yet
    # released. Move this back to a version specifier once neo ships it.
    "neo @ git+https://github.com/NeuralEnsemble/python-neo.git@5f64a9e03896489311d0047a27f8bf74786a8453",
    "dandi>=0.67.3",
    "dandischema>=0.10.2",
    "nwbinspector>=0.6.3",
    "ndx-events==0.2.1",
    "ndx-fiber-photometry==0.1.0",
    "tdt==0.6.5",
    "PyYAML>=6.0.1",
    "openpyxl>=3.1.5",
    "pandas>=2.2.0",
    "opencv-python-headless",
]

[project.urls]
Repository = "https://github.com/catalystneuro/nelson-lab-to-nwb"

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["*"]

[tool.black]
line-length = 120
